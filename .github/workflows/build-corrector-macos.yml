name: Build Skeleton Corrector for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: ['codex/macos-arm64-package-*']
    paths:
      - '.github/workflows/build-corrector-macos.yml'
      - 'packaging/**'
      - 'tools/build_corrector_macos.py'
      - 'corrector_main.py'
      - 'cvslice/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: packaging/requirements-macos.txt
      - name: Install dependencies
        run: |
          python -m pip install -r packaging/requirements-macos.txt
          python -m pip install --no-deps rtmlib==0.0.15
          python -c "import platform, cv2, onnxruntime, rtmlib; assert platform.machine() == 'arm64'"
      - name: Run isolated regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q tests/test_timeline.py tests/test_ik.py
          tests/test_qc.py tests/test_corrector_helpers.py tests/test_corrector_workflow.py
      - name: Build, smoke test and archive
        run: python tools/build_corrector_macos.py
      - name: Upload app and verification report
        uses: actions/upload-artifact@v4
        with:
          name: CVSlice-SkeletonCorrector-macOS-arm64
          path: |
            dist/macos-arm64/*.zip
            dist/macos-arm64/*.json
            dist/macos-arm64/*.txt
            dist/macos-arm64/*.png
          if-no-files-found: error
          retention-days: 30
